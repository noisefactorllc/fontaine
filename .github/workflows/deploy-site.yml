name: Deploy Site (Full Rebuild)

# Full site rebuild: downloads the font catalogue, converts to WOFF2,
# builds the block fonts and the site. The site release workflow is the
# sole authority for fonts.noisefactor.io deploys, so the build itself now
# runs there — this workflow just fires its workflow_dispatch; the release
# clones this repo at the tagged SHA, runs
# that same build, rsyncs dist/site/ (excluding bundle/) to the
# production web server, flushes the CDN edges, and verifies through
# the edge.
#
# Keeping the SSH key + server IP on the release side means this
# public repo carries no deploy secrets — only the GitHub App private
# key, which is scoped to dispatching release workflows.
#
# The deploy is deliberately not --delete and excludes bundle/: the
# same content root also holds the versioned font bundle, which
# fontaine-bundle owns. The release serializes all three fontaine arms in
# one concurrency group, so the tag push that fires both this and
# release.yml no longer races them against one content root.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-release:
    name: Dispatch the site release
    runs-on: ubuntu-latest

    steps:
      - name: Check the release dispatch configuration
        env:
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          STATIC_SITE_RELEASE_WORKFLOW: ${{ secrets.STATIC_SITE_RELEASE_WORKFLOW }}
        run: |
          missing=""
          [ -n "$RELEASE_REPOSITORY" ] || missing="$missing RELEASE_REPOSITORY"
          [ -n "$STATIC_SITE_RELEASE_WORKFLOW" ] || missing="$missing STATIC_SITE_RELEASE_WORKFLOW"
          if [ -n "$missing" ]; then
            echo "::error::The release dispatch is not configured. Empty or unset secret(s):$missing"
            exit 1
          fi

      - name: Mint release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: ${{ secrets.RELEASE_REPOSITORY }}

      - name: Dispatch the site release for fontaine site
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          STATIC_SITE_RELEASE_WORKFLOW: ${{ secrets.STATIC_SITE_RELEASE_WORKFLOW }}
        run: |
          gh workflow run "$STATIC_SITE_RELEASE_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY_OWNER/$RELEASE_REPOSITORY" \
            --ref main \
            -f site=fontaine-site \
            -f sha=${{ github.sha }}
          echo "Dispatched the site release for fontaine-site @ ${{ github.sha }}"
