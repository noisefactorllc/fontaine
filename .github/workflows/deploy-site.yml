name: Deploy Site (Full Rebuild)

# Full site rebuild: downloads the font catalogue, converts to WOFF2,
# builds the block fonts and the site. Scaffold is the sole authority
# for fonts.noisefactor.io deploys, so the build itself now runs there
# — this workflow just fires the workflow_dispatch at scaffold's
# static-site-release, which clones this repo at the tagged SHA, runs
# that same build, rsyncs dist/site/ (excluding bundle/) to the
# production web server, flushes the CDN edges, and verifies through
# the edge.
#
# Keeping the SSH key + server IP on the scaffold side means this
# public repo carries no deploy secrets — only the EHSRE app private
# key, which is scoped to dispatching scaffold workflows.
#
# The deploy is deliberately not --delete and excludes bundle/: the
# same content root also holds the versioned font bundle, which
# fontaine-bundle owns. Scaffold serializes all three fontaine arms in
# one concurrency group, so the tag push that fires both this and
# release.yml no longer races them against one content root.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-scaffold-release:
    name: Dispatch scaffold static-site-release
    runs-on: ubuntu-latest

    steps:
      - name: Mint scaffold GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: scaffold

      - name: Dispatch scaffold static-site-release for fontaine site
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run static-site-release.yml \
            --repo noisefactorllc/scaffold \
            --ref main \
            -f site=fontaine-site \
            -f sha=${{ github.sha }}
          echo "Dispatched scaffold static-site-release for fontaine-site @ ${{ github.sha }}"
