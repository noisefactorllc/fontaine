name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fonttools Pillow brotli tqdm

      - name: Download fonts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python download_fonts.py

      - name: Build bundle
        run: python build_bundle.py

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Create release archive
        run: |
          mkdir -p release
          cp bundle/fonts.zip release/fontaine-${{ steps.version.outputs.version }}-fonts.zip
          cp bundle/fonts.json release/
          cp bundle/manifest.json release/
          cp font-loader.js release/
          cp README.md release/
          cp LICENSE release/
          cd release && zip -r ../fontaine-${{ steps.version.outputs.version }}.zip .

      - name: Generate release notes
        id: notes
        run: |
          FONT_COUNT=$(jq '.total_fonts' bundle/manifest.json)
          BUNDLE_SIZE=$(jq '.bundle_size' bundle/manifest.json)
          BUNDLE_SIZE_MB=$(echo "scale=1; $BUNDLE_SIZE / 1048576" | bc)

          cat << EOF > release_notes.md
          ## fontaine v${{ steps.version.outputs.version }}

          A curated collection of freely distributable web fonts with an async, cache-aware loader.

          ### Bundle Info
          - **Fonts:** $FONT_COUNT
          - **Bundle Size:** ${BUNDLE_SIZE_MB} MB

          ### Files
          - \`fontaine-${{ steps.version.outputs.version }}.zip\` - Complete release bundle
          - \`fontaine-${{ steps.version.outputs.version }}-fonts.zip\` - Font files only (WOFF2)
          - \`fonts.json\` - Font catalog with metadata
          - \`manifest.json\` - Bundle manifest
          - \`font-loader.js\` - JavaScript font loader

          ### Quick Start
          \`\`\`html
          <script src="font-loader.js"></script>
          <script>
            const loader = new FontLoader();
            await loader.load('./bundle');
          </script>
          \`\`\`

          See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: fontaine ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'SNAPSHOT') || contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          files: |
            fontaine-${{ steps.version.outputs.version }}.zip
            release/fontaine-${{ steps.version.outputs.version }}-fonts.zip
            release/fonts.json
            release/manifest.json
            release/font-loader.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the release dispatch configuration
        if: success()
        env:
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          STATIC_SITE_RELEASE_WORKFLOW: ${{ secrets.STATIC_SITE_RELEASE_WORKFLOW }}
        run: |
          missing=""
          [ -n "$RELEASE_REPOSITORY" ] || missing="$missing RELEASE_REPOSITORY"
          [ -n "$STATIC_SITE_RELEASE_WORKFLOW" ] || missing="$missing STATIC_SITE_RELEASE_WORKFLOW"
          if [ -n "$missing" ]; then
            echo "::error::The release dispatch is not configured. Empty or unset secret(s):$missing"
            exit 1
          fi

      - name: Generate app token
        if: success()
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: ${{ secrets.RELEASE_REPOSITORY }}

      - name: Dispatch the site release for the font bundle
        if: success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          STATIC_SITE_RELEASE_WORKFLOW: ${{ secrets.STATIC_SITE_RELEASE_WORKFLOW }}
        # The site release workflow is the sole authority for
        # fonts.noisefactor.io deploys: it clones this repo at the tagged
        # SHA, rebuilds the bundle, rsyncs it into content/bundle/, flushes
        # the CDN edges and verifies through the edge. This repo keeps no
        # deploy secrets — only the GitHub App key, scoped to dispatching
        # release workflows.
        #
        # Note the bundle is therefore built twice from one tag: once
        # here for the GitHub Release assets above, once by the release
        # for the CDN. download_fonts.py tracks upstream "latest"
        # releases and manifest.json stamps a build timestamp, so the
        # two are same-SHA but not byte-identical. The Release asset is
        # the pinned download; the CDN copy is the live one.
        run: |
          gh workflow run "$STATIC_SITE_RELEASE_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY_OWNER/$RELEASE_REPOSITORY" \
            --ref main \
            -f site=fontaine-bundle \
            -f sha=${{ github.sha }}
          echo "Dispatched the site release for fontaine-bundle @ ${{ github.sha }}"
