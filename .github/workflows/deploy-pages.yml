name: Deploy Pages

# Fast path for hand-edited landing + demo pages, skipping the full
# font build. Scaffold is the sole authority for fonts.noisefactor.io
# deploys: this workflow just fires the workflow_dispatch at scaffold's
# static-site-release, which clones this repo at the pushed SHA, stages
# index.html + demo/, rsyncs to the production web server, flushes the
# CDN edges, and verifies through the edge.
#
# Keeping the SSH key + server IP on the scaffold side means this
# public repo carries no deploy secrets — only the EHSRE app private
# key, which is scoped to dispatching scaffold workflows.
#
# The deploy is deliberately not --delete: the same content root also
# holds the full site build (fontaine-site) and the versioned font
# bundle (fontaine-bundle). Scaffold serializes all three arms in one
# concurrency group.

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'example.html'
      - 'font-loader.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger-scaffold-release:
    name: Dispatch scaffold static-site-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Mint scaffold GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: scaffold

      - name: Dispatch scaffold static-site-release for fontaine pages
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run static-site-release.yml \
            --repo noisefactorllc/scaffold \
            --ref main \
            -f site=fontaine-pages \
            -f sha=${{ github.sha }}
          echo "Dispatched scaffold static-site-release for fontaine-pages @ ${{ github.sha }}"
