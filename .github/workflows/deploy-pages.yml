name: Deploy Pages

# Fast path for hand-edited landing + demo pages, skipping the full
# font build. The site release workflow is the sole authority for
# fonts.noisefactor.io deploys: this workflow just fires its
# workflow_dispatch; the release clones this repo at the pushed SHA, stages
# index.html + demo/, rsyncs to the production web server, flushes the
# CDN edges, and verifies through the edge.
#
# Keeping the SSH key + server IP on the release side means this
# public repo carries no deploy secrets — only the GitHub App private
# key, which is scoped to dispatching release workflows.
#
# The deploy is deliberately not --delete: the same content root also
# holds the full site build (fontaine-site) and the versioned font
# bundle (fontaine-bundle). The release serializes all three arms in one
# concurrency group.

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'example.html'
      - 'font-loader.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch-release:
    name: Dispatch the site release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check the release dispatch configuration
        env:
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          STATIC_SITE_RELEASE_WORKFLOW: ${{ secrets.STATIC_SITE_RELEASE_WORKFLOW }}
        run: |
          missing=""
          [ -n "$RELEASE_REPOSITORY" ] || missing="$missing RELEASE_REPOSITORY"
          [ -n "$STATIC_SITE_RELEASE_WORKFLOW" ] || missing="$missing STATIC_SITE_RELEASE_WORKFLOW"
          if [ -n "$missing" ]; then
            echo "::error::The release dispatch is not configured. Empty or unset secret(s):$missing"
            exit 1
          fi

      - name: Mint release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: ${{ secrets.RELEASE_REPOSITORY }}

      - name: Dispatch the site release for fontaine pages
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          STATIC_SITE_RELEASE_WORKFLOW: ${{ secrets.STATIC_SITE_RELEASE_WORKFLOW }}
        run: |
          gh workflow run "$STATIC_SITE_RELEASE_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY_OWNER/$RELEASE_REPOSITORY" \
            --ref main \
            -f site=fontaine-pages \
            -f sha=${{ github.sha }}
          echo "Dispatched the site release for fontaine-pages @ ${{ github.sha }}"
